services:
  db:
    image: postgres:15-alpine
    container_name: realestate_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-real_estate_db}
      POSTGRES_USER: ${POSTGRES_USER:-real_estate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-real_estate_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-real_estate_user} -d ${POSTGRES_DB:-real_estate_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: realestate_web
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-real_estate_user}:${POSTGRES_PASSWORD:-real_estate_password}@db:5432/${POSTGRES_DB:-real_estate_db}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-local-docker-key-change-me}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      WEATHER_CITY: ${WEATHER_CITY:-Minsk}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  logs_data:
