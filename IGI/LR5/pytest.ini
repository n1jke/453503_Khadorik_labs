[pytest]
DJANGO_SETTINGS_MODULE = RealEstateAgency.settings
python_files = tests.py test_*.py *_tests.py
pythonpath = .
addopts = -v --tb=short --cov=agency --cov-report=term-missing --cov-report=html --cov-fail-under=60
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = agency
omit =
    agency/migrations/*
    agency/management/*
    agency/tests/*
    agency/apps.py
    agency/admin.py
