{% extends 'agency/base_auth.html' %}

{% block content %}
<h2>Добавить отзыв</h2>
<form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
    <p>
        <label for="{{ field.id_for_label }}">{{ field.label }}</label><br>
        {{ field }}
        {% if field.errors %}<br><span>{{ field.errors.0 }}</span>{% endif %}
    </p>
    {% endfor %}
    <button type="submit">Отправить</button>
</form>
{% endblock %}
