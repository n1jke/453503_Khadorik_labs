<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{{ title }}{% endblock %} — Агентство недвижимости</title>
</head>
<body>
    <header>
        <h1>Агентство недвижимости</h1>
        <nav>
            <a href="{% url 'agency:home' %}">Главная</a>
            {% if user.is_authenticated %}
                <span>Роль: {{ user_role }}</span>
                <a href="{% url 'agency:logout' %}">Выход ({{ user.username }})</a>
            {% else %}
                <a href="{% url 'agency:login' %}">Вход</a>
                <a href="{% url 'agency:register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    {% if messages %}
    <ul>
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
