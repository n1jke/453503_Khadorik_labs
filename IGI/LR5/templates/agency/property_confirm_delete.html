{% extends 'base.html' %}

{% block title %}Удалить объект{% endblock %}

{% block content %}
<h2>Удалить объект?</h2>
<p><strong>{{ property.title }}</strong> ({{ property.code }})</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'agency:property_detail' property.pk %}">Отмена</a>
</form>
{% endblock %}
